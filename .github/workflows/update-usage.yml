# Met à jour les stats d'usage Smogon chaque mois (elles sont publiées
# mensuellement) et committe src/data/usage.json, ce qui redéploie le site.
name: Mise à jour des stats d'usage

on:
  schedule:
    - cron: "0 6 3 * *"   # le 3 de chaque mois à 6h UTC
  workflow_dispatch:        # lançable à la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main         # toujours partir du dernier commit de main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-usage.mjs
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/usage.json
          if git diff --cached --quiet; then
            echo "Aucun changement, rien à pousser."
          else
            git commit -m "Stats d'usage Smogon : mise à jour automatique"
            git pull --rebase origin main
            git push origin main
          fi
